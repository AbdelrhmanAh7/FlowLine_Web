# CodeRabbit config (Essentials plan: 5 reviews/hour/repo shared by PR + CLI, 50 chat messages, 150 files/review).
# Schema: https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/uv.lock"
    - "!public/media/**"
    - "!**/*.mp4"
    - "!**/*.webm"
    - "!**/*.{png,jpg,jpeg,gif,webp,ico,pdf,pptx,traineddata}"
    - "!**/__snapshots__/**"
    - "!**/*.snap"
    - "!**/*.tsbuildinfo"
    - "!**/*.min.js"
    - "!drizzle/meta/**"
    - "!design-reference/**"
    - "!artifacts/**"
  path_instructions:
    - path: "src/app/**/auth/**"
      instructions: "Auth/session/MFA/permissions: flag missing authz checks, session fixation or non-rotating sessions, MFA bypass paths, role checks done client-side only, tokens or secrets in logs or responses, and missing tests for each branch."
    - path: "src/server/**"
      instructions: "Server code: every route/action must authenticate and authorize the caller and scope data to their workspace. Flag unchecked input and error leaks."
    - path: "src/i18n/**"
      instructions: "User-facing strings: Arabic/RTL. Flag hardcoded English or Arabic literals outside the i18n catalog, missing en/ar key pairs, physical left/right CSS where logical start/end is needed, and unmirrored icons or numerals."
    - path: "src/components/**"
      instructions: "User-facing strings: Arabic/RTL. Flag hardcoded English or Arabic literals outside the i18n catalog, missing en/ar key pairs, physical left/right CSS where logical start/end is needed, and unmirrored icons or numerals."
    - path: "e2e/**"
      instructions: "Playwright specs: flag flaky waits, hardcoded sleeps and selectors that depend on copy instead of roles or test ids."
  tools:
    eslint:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
  pre_merge_checks:
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "Linked issue"
        mode: warning
        instructions: "The PR description must reference an issue (Closes/Fixes/Refs #N). Warn if none is linked."
      - name: "Tests changed with code"
        mode: warning
        instructions: "If the PR changes production source code (not docs, config or comments only), it must also add or modify a test file. Warn otherwise."
      - name: "e2e-army test for UI flows"
        mode: warning
        instructions: "If the PR changes a user-facing UI flow (routes, forms, navigation, checkout/auth screens), it should add or update a test file under e2e-army/. Warn only; never fail."
knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
chat:
  auto_reply: true
