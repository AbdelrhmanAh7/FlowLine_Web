# CodeRabbit runs only on GitHub (no local CodeRabbit CLI).
# Stacked PRs: their base is the previous PR's branch, so allow any base branch.
# Rate limits: chat replies are NOT automatic (thread replies like "Fixed in <sha>" don't spend chat messages);
# tag @coderabbitai only when its answer is needed (max ~5 per hour). Fixes are verified by the incremental
# review on each push, so push one batch per fix round.
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
chat:
  auto_reply: false
