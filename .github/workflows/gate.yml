name: Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - 'docs/**'
      - 'artifacts/**'
      - '**/*.md'
      - 'design-reference/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'artifacts/**'
      - '**/*.md'
      - 'design-reference/**'
  workflow_dispatch:
    inputs:
      tier:
        description: Gate tier to run
        type: choice
        required: true
        default: fast
        options: [fast, full]

permissions:
  contents: read

concurrency:
  # An unrelated `labeled` event gets its own group, so its no-op run never cancels a real gate run.
  group: gate-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-gate' && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Checks share one setup; browser jobs run in parallel on isolated runners. The final `gate` job combines results
# (main currently has no enforced required check). Shared setup/report: .github/actions/{setup-gate,gate-report}.
# Full tier: dispatch tier=full or a full-gate label on a PR into main; otherwise fast.
# Apply full-gate once just before merging; drafts and unrelated labeled events allocate no runners.
jobs:
  checks:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'full-gate')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GATE_OUT: artifacts/gates/ci-${{ github.run_id }}-${{ github.run_attempt }}-checks
      GATE_TIER: ${{ ((github.event_name == 'workflow_dispatch' && inputs.tier == 'full') || (github.event_name == 'pull_request' && github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'full-gate'))) && 'full' || 'fast' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gate
        with:
          postgres: "true"
          sandbox-image: "true"

      - name: Run gate (static, unit, contract, integration)
        run: pnpm gate --only=static,unit,contract,integration --out="$GATE_OUT"

      - name: Report
        if: always()
        uses: ./.github/actions/gate-report
        with:
          job: checks
          out: ${{ env.GATE_OUT }}
          tier: ${{ env.GATE_TIER }}

  chromium:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'full-gate')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLOWLINE_GATE_NATIVE_BROWSERS: "1"
      GATE_OUT: artifacts/gates/ci-${{ github.run_id }}-${{ github.run_attempt }}-chromium
      GATE_TIER: ${{ ((github.event_name == 'workflow_dispatch' && inputs.tier == 'full') || (github.event_name == 'pull_request' && github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'full-gate'))) && 'full' || 'fast' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gate
        with:
          postgres: "true"
          browsers: chromium

      # Selecting a browser implies build + stack. Fast tier: @critical/@cross-browser specs; full tier: every spec.
      - name: Run gate (chromium)
        run: pnpm gate --tier="$GATE_TIER" --only=chromium --out="$GATE_OUT"

      - name: Report
        if: always()
        uses: ./.github/actions/gate-report
        with:
          job: chromium
          out: ${{ env.GATE_OUT }}
          tier: ${{ env.GATE_TIER }}

  firefox:
    # Full tier only; skipped by design on the fast tier.
    if: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'full-gate'))) && ((github.event_name == 'workflow_dispatch' && inputs.tier == 'full') || (github.event_name == 'pull_request' && github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'full-gate'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLOWLINE_GATE_NATIVE_BROWSERS: "1"
      GATE_OUT: artifacts/gates/ci-${{ github.run_id }}-${{ github.run_attempt }}-firefox
      GATE_TIER: full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gate
        with:
          postgres: "true"
          browsers: firefox

      - name: Run gate (firefox)
        run: pnpm gate --tier=full --only=firefox --out="$GATE_OUT"

      - name: Report
        if: always()
        uses: ./.github/actions/gate-report
        with:
          job: firefox
          out: ${{ env.GATE_OUT }}
          tier: ${{ env.GATE_TIER }}

  webkit:
    # Full tier only; skipped by design on the fast tier.
    if: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'full-gate'))) && ((github.event_name == 'workflow_dispatch' && inputs.tier == 'full') || (github.event_name == 'pull_request' && github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'full-gate'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLOWLINE_GATE_NATIVE_BROWSERS: "1"
      GATE_OUT: artifacts/gates/ci-${{ github.run_id }}-${{ github.run_attempt }}-webkit
      GATE_TIER: full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gate
        with:
          postgres: "true"
          browsers: webkit

      - name: Run gate (webkit)
        run: pnpm gate --tier=full --only=webkit --out="$GATE_OUT"

      - name: Report
        if: always()
        uses: ./.github/actions/gate-report
        with:
          job: webkit
          out: ${{ env.GATE_OUT }}
          tier: ${{ env.GATE_TIER }}

  # Every selected job must succeed; only firefox/webkit may be skipped, and only on the fast tier.
  # Match the PR guard even with always(), so intentionally skipped runs allocate no combiner runner.
  gate:
    needs: [checks, chromium, firefox, webkit]
    if: ${{ always() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'full-gate'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GATE_TIER: ${{ ((github.event_name == 'workflow_dispatch' && inputs.tier == 'full') || (github.event_name == 'pull_request' && github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'full-gate'))) && 'full' || 'fast' }}
      R_CHECKS: ${{ needs.checks.result }}
      R_CHROMIUM: ${{ needs.chromium.result }}
      R_FIREFOX: ${{ needs.firefox.result }}
      R_WEBKIT: ${{ needs.webkit.result }}
    steps:
      - name: Combine job results
        run: |
          ok=1
          {
            echo "## FlowLine gate ($GATE_TIER tier)"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            for pair in "checks:$R_CHECKS" "chromium:$R_CHROMIUM" "firefox:$R_FIREFOX" "webkit:$R_WEBKIT"; do
              name="${pair%%:*}"
              result="${pair#*:}"
              note=""
              if [ "$result" = "success" ]; then
                :
              elif [ "$result" = "skipped" ] && [ "$GATE_TIER" = "fast" ] && { [ "$name" = "firefox" ] || [ "$name" = "webkit" ]; }; then
                note=" (fast tier: skipped by design)"
              else
                ok=0
              fi
              echo "| $name | $result$note |"
            done
            echo
            if [ "$ok" = 1 ]; then echo "Result: **PASS**"; else echo "Result: **FAIL**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = 1 ]
