name: Nightly

# Slow or infra-sensitive suites moved out of the PR gate (see docs/implementation/SMALL_GATES.md, "Nightly tier").
# Not a required check: a red nightly opens a follow-up, it never blocks a PR. Runs on main only (schedule), or on any ref by dispatch.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-gate
        with:
          postgres: "true"
          sandbox-image: "true"

      # The Postgres container only has the `flowline` database; the suite's global setup migrates DATABASE_URL (flowline_test),
      # so create it first (the Gate's integration legs do the same).
      - name: Create the nightly database
        run: docker exec flowline-ci-postgres createdb -U flowline flowline_test

      - name: Run the nightly project (code sandbox, upgrade paths, company-builder CLI prototype, dependency pins)
        run: pnpm test:nightly

  # A red nightly is not a required check, so it must reach someone: this job opens one `nightly-red` issue (or comments on
  # the open one) with the run link. The hub's engineers pick it up like any bug; nothing waits for an owner decision.
  report:
    needs: nightly
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Create the label if it doesn't exist; if it fails for any reason other than "already exists",
          # fall back to creating the issue without the label.
          gh label create nightly-red --color B60205 --description "Nightly test tier failed on main" 2>/dev/null || true
          open=$(gh issue list --state open --label nightly-red --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Nightly failed again: $RUN_URL"
          else
            # Try with label first; if that fails (e.g., label creation failed), create without label.
            gh issue create --label nightly-red --title "Nightly tests failed on main" \
              --body "The nightly tier (\`pnpm test:nightly\`, see docs/implementation/SMALL_GATES.md) failed: $RUN_URL" 2>/dev/null \
            || gh issue create --title "Nightly tests failed on main" \
              --body "The nightly tier (\`pnpm test:nightly\`, see docs/implementation/SMALL_GATES.md) failed: $RUN_URL"
          fi
